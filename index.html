: "Fabio Ramos", "dias": 8}, {"id": "1343742", "tipo": "Task", "titulo": "Levantar os dados exigidos pelo DBA para liberar a consulta", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 8}, {"id": "1346355", "tipo": "Task", "titulo": "Notificar o grupo da X-VIA sobre a restrição de acesso externo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 5}, {"id": "1343743", "tipo": "Task", "titulo": "Obter com o Maycon o IP da máquina e o nome dos bancos", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 8}, {"id": "1343741", "tipo": "Task", "titulo": "Validar com a equipe de DBA a liberação do usuário de leitura", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 8}]}, {"nome": "Aplicativo MS Digital", "itens": [{"id": "1343824", "tipo": "Task", "titulo": "Levantar a Carteira do Visitante — OPORTUNIDADE para o novo aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 4}, {"id": "1343822", "tipo": "Task", "titulo": "Levantar o exemplo da CIPTEA no aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 4}, {"id": "1343821", "tipo": "Task", "titulo": "Levantar o exemplo da Carteira Desportiva no aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 4}, {"id": "1343818", "tipo": "Task", "titulo": "Levantar o exemplo da Carteira Funcional no aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 4}, {"id": "1343823", "tipo": "Task", "titulo": "Levantar o exemplo da Carteira Passe Intermunicipal no aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 4}, {"id": "1343817", "tipo": "Task", "titulo": "Levantar o exemplo da Carteira de Pesca no aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 8}, {"id": "1343815", "tipo": "Task", "titulo": "Levantar o exemplo da Carteira de Vacinação no aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 4}, {"id": "1343816", "tipo": "Task", "titulo": "Levantar o exemplo da Carteira do Doador no aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 4}, {"id": "1343820", "tipo": "Task", "titulo": "Levantar o exemplo da Carteira do Estudante no aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 8}, {"id": "1343814", "tipo": "Task", "titulo": "Levantar o exemplo do Cartão SUS no aplicativo", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 4}]}, {"nome": "Reuniões", "itens": [{"id": "1346135", "tipo": "Task", "titulo": "01/09/2026 - Pendências do CMS", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 7}, {"id": "1346601", "tipo": "Task", "titulo": "02/09/2026 - Alinhamento das apresentações dos módulos para a X-VIA", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 6}, {"id": "1347387", "tipo": "Task", "titulo": "03/09/2026 - Dúvidas do CMS da carta de serviços", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 5}, {"id": "1346714", "tipo": "Task", "titulo": "03/09/2026 - Treinamento X-flows e X-forms", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 5}]}]}]}/*DATA_END*/;</script>
<script>
(function () {
  var TFS = 'https://tfs.sgi.ms.gov.br/tfs/Global/XVIA/_workitems/edit/';
  var BUCKETS = [
    { key: 'done',  label: 'Finalizado' },
    { key: 'prog',  label: 'Em andamento' },
    { key: 'todo',  label: 'Pendente' },
    { key: 'block', label: 'Bloqueado' }
  ];
  var app = document.getElementById('app');
  var select = document.getElementById('week-select');
  var meta = document.getElementById('meta');
  var dados = window.RELATORIO || { semanas: [] };
  var semanas = dados.semanas || [];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderStats(s) {
    var total = BUCKETS.reduce(function (n, b) { return n + (s.stats[b.key] || 0); }, 0) || 1;
    return '<section class="stats">' + BUCKETS.map(function (b) {
      var v = s.stats[b.key] || 0;
      var pct = Math.round(v / total * 100);
      return '<div class="stat stat--' + b.key + '">' +
        '<div class="stat-value">' + v + '</div>' +
        '<div class="stat-label">' + b.label + '</div>' +
        '<div class="stat-bar"><span style="width:' + pct + '%"></span></div>' +
        '</div>';
    }).join('') + '</section>';
  }

  function renderBloqueios(s) {
    if (!s.bloqueios || !s.bloqueios.length) return '';
    return '<section class="blocks"><h2>Bloqueado — precisa de decisão</h2><ul>' +
      s.bloqueios.map(function (i) {
        var dias = i.dias == null ? '' :
          ' <span class="days">· parado há ' + i.dias + (i.dias === 1 ? ' dia' : ' dias') + '</span>';
        return '<li><a href="' + TFS + i.id + '" target="_blank" rel="noopener">#' + i.id + '</a> · ' +
          esc(i.titulo) + dias + '</li>';
      }).join('') + '</ul></section>';
  }

  function renderResumo(s) {
    if (!s.resumo_html) return '';
    return '<section class="card resumo">' + s.resumo_html + '</section>';
  }

  function linha(i) {
    return '<li class="item">' +
      '<span class="status-tag status-tag--' + i.bucket + '">' + esc(i.bucket === 'block' ? 'Bloqueado' : i.estado) + '</span>' +
      '<span class="item-id"><a href="' + TFS + i.id + '" target="_blank" rel="noopener">#' + i.id + '</a></span>' +
      '<span class="item-titulo">' + esc(i.titulo) + '</span>' +
      '<span class="item-resp">' + esc(i.responsavel) + '</span>' +
      '</li>';
  }

  function renderFrentes(s) {
    if (!s.frentes || !s.frentes.length) return '';
    return '<h2 class="secao">Entregas por frente</h2>' + s.frentes.map(function (f) {
      var abertos = f.itens.filter(function (i) { return i.bucket !== 'done'; });
      var fechados = f.itens.filter(function (i) { return i.bucket === 'done'; });
      var corpo = '';

      if (abertos.length) corpo += '<ul class="itens">' + abertos.map(linha).join('') + '</ul>';

      // Lista longa de finalizado e scroll sem informacao. Acima de 5, recolhe.
      if (fechados.length > 5) {
        corpo += '<details class="fechados"><summary>' + fechados.length +
          ' finalizados</summary><ul class="itens">' + fechados.map(linha).join('') +
          '</ul></details>';
      } else if (fechados.length) {
        corpo += '<ul class="itens">' + fechados.map(linha).join('') + '</ul>';
      }

      return '<details class="frente"' + (abertos.length ? ' open' : '') + '>' +
        '<summary><span class="frente-nome">' + esc(f.nome) + '</span>' +
        (abertos.length ? '<span class="frente-abertos">' + abertos.length + ' em aberto</span>' : '') +
        '<span class="frente-count">' + f.itens.length + '</span></summary>' +
        corpo + '</details>';
    }).join('');
  }

  function render(idx) {
    var s = semanas[idx];
    if (!s) {
      app.innerHTML = '<div class="empty">Nenhuma semana ainda.<br>' +
        'Exporte a query do TFS para <code>dados/AAAA-MM-DD.csv</code> e rode <code>python build.py</code>.</div>';
      return;
    }
    app.innerHTML = renderStats(s) + renderBloqueios(s) + renderResumo(s) + renderFrentes(s);
  }

  if (!semanas.length) {
    select.style.display = 'none';
    render(-1);
    return;
  }

  select.innerHTML = semanas.map(function (s, i) {
    return '<option value="' + i + '">' + esc(s.periodo) + '</option>';
  }).join('');
  select.addEventListener('change', function () { render(Number(select.value)); });

  meta.textContent = semanas.length + ' semana' + (semanas.length === 1 ? '' : 's') +
    (dados.generated_at ? ' · ' + dados.generated_at : '');
  render(0);
})();
</script>
