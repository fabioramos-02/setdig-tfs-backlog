SO)</strong> — A PoC em Next.js mostra os 5 passos do login gov.br pelo Controlador. O roteiro de integração tira as dúvidas de cada passo.</li>\n<li><strong>CBMMS e DETRAN</strong> — Os ofícios do Parte Diária e do Portal de Credenciamento viraram PBIs, com o cadastro dos clients e a reunião com cada órgão.</li>\n<li><strong>Migração para o SmartPass</strong> — 34 sistemas de 12 órgãos tiveram uma task de migração lançada, com a lista do BI SETDIG. O banco do Controlador tem 56 aplicações, então a lista ainda vai crescer.</li>\n<li><strong>Selo Arte (IAGRO) no e-MS</strong> — Na conversa com a Duda e o Caetano, a ideia aprovada foi o formulário chegar como documento na área de protocolo do órgão. O fluxo foi desenhado no Excalidraw e revisado com as raias de cada sistema.</li>\n<li><strong>X-Forms</strong> — Os 14 formulários foram vinculados aos serviços em DEV. O time da SGD entrou nos grupos do X-Forms Designer.</li>\n<li><strong>Suporte (GLPI)</strong> — Criamos a automação que abre chamado e lança a task de acompanhamento. Os primeiros chamados foram o 328949 (impressora da Bianca) e o 329004 (cliente de API do GLPI).</li>\n</ul>\n<h2>Reuniões da semana</h2>\n<ul>\n<li><strong>26/10 — Alinhamento semanal com a Duda.</strong> #1368000</li>\n<li><strong>26/10 — Dúvidas do CMS.</strong> #1368003</li>\n<li><strong>27/10 — Organização do TFS para finalizar o App</strong>, com a Duda. #1369136</li>\n<li><strong>28/10 — Pedido do assinador gov.br com o Sandro.</strong> #1369725</li>\n<li><strong>28/10 — Piloto do Selo Arte (IAGRO) no e-MS</strong>, com a Duda e o Caetano. O formulário vai chegar como documento no protocolo do órgão. #1369726</li>\n<li><strong>28/10 — Categorias de serviço da carta</strong>, com a Daniele e a Bianca. #1369801</li>\n<li><strong>28/10 — Alinhamento do TFS entre a X-VIA e o MS.</strong> Ficou combinado como usar o board, os campos de prazo e as atividades. Gerou ata. #1369893</li>\n<li><strong>29/10 — Ponto de controle do Projeto MS</strong>, com a X-VIA. Os sistemas continuam no Controlador e o login gov.br ficou parado até haver um piloto. As APIs do Detran precisam ser validadas até 12/11. A home do app ganha sugestões cadastradas no CMS. Gerou ata e 7 tasks para o Fabio. #1372620</li>\n</ul>\n<h2>Aguardando terceiros</h2>\n<ul>\n<li><strong>ITSM</strong> — O chamado 329004 foi reaberto em 03/11. O app_token chegou, mas o login na API devolve erro 500 no servidor.</li>\n<li><strong>X-VIA (Maycon)</strong> — Precisa confirmar três pontos da migração para o SmartPass: se os callbacks atuais funcionam, quanto tempo o Controlador e o SmartPass vão funcionar juntos e quem cadastra os clients.</li>\n<li><strong>Sandro</strong> — As credenciais do assinador gov.br de desenvolvimento, homologação e produção seguem em andamento.</li>\n<li><strong>GAT</strong> — O chamado 328949, da impressora da Bianca.</li>\n</ul>\n<h2>Urgente do nosso time</h2>\n<p>Marcar as reuniões com o CBMMS e com o DETRAN e solicitar o cadastro dos clients no Controlador. Os dois órgãos só começam a integração depois disso.</p>", "frentes": [{"nome": "CMS Cartas", "itens": [{"id": "1363789", "tipo": "Task", "titulo": "Verificar o andamento da migração dos gerentes e coordenadores no CMS da Carta de Serviços", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 6}, {"id": "1365961", "tipo": "Task", "titulo": "Receber da X-VIA o passo a passo de atribuição das roles no SmartPass", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 7}]}, {"nome": "Cartas de Serviços", "itens": [{"id": "1356686", "tipo": "Task", "titulo": "Apresentar à CGE as cartas de serviço em ambiente de homologação", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 7}, {"id": "1367835", "tipo": "Task", "titulo": "Refinar o pacote de entrega TO BE da revisão com linguagem simples por IA", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 8}, {"id": "1360252", "tipo": " ação foi entregue ao Victor Carnaval, e a\n  previsão de conclusão da migração foi levantada com a X-VIA.</li>\n<li><strong>FormFlow</strong> — os colaboradores da X-VIA entraram no Controlador e no FormFlow de homologação.</li>\n</ul>\n<h2>Aguardando terceiros</h2>\n<ul>\n<li><strong>X-VIA</strong> — definir quem corrige cada pendência da planilha de migração das cartas.</li>\n<li><strong>Equipe da Thereza</strong> — a governança do Design System passou a ser conduzida por ela. Enquanto não\n  sai, o acesso ao registry para órgão fora do grupo xvia segue sem solução, e o Corpo de Bombeiros\n  depende disso.</li>\n<li><strong>UGSI, Infraestrutura e X-VIA</strong> — aplicar o que foi decidido: VPN no ambiente de desenvolvimento\n  e MFA no de homologação. A decisão existe, a configuração não.</li>\n</ul>\n<h2>Urgente do nosso time</h2>\n<p>Marcar a reunião das áreas sobre o acesso a desenvolvimento e homologação. A X-VIA perde o acesso\npor fora assim que a regra for aplicada, e ninguém assumiu prazo para o túnel VPN que eles mesmos\nvão manter — sem isso, o time de desenvolvimento deles fica sem ambiente.</p>\n<p>Falta também testar a conexão ao banco do CMS e confirmar na prática que o usuário é somente\nleitura. O sufixo <code>_ro</code> no nome não é garantia de permissão.</p>", "frentes": [{"nome": "Cartas de Serviços", "itens": [{"id": "1360252", "tipo": "Task", "titulo": "Apoiar o Kauã nas dúvidas e na migração das cartas de serviço", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 29}, {"id": "1359940", "tipo": "Task", "titulo": "Preencher na planilha as pendências das cartas de serviço para a migração", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 29}, {"id": "1360737", "tipo": "Task", "titulo": "Verificar a previsão de conclusão da migração das cartas de serviço", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 28}]}, {"nome": "Design System", "itens": [{"id": "1340717", "tipo <script>
(function () {
  var TFS = 'https://tfs.sgi.ms.gov.br/tfs/Global/XVIA/_workitems/edit/';
  var dados = window.RELATORIO || {};
  var semanas = dados.semanas || [];
  var app = document.getElementById('app');
  var select = document.getElementById('semana');

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function link(id) { return '<a href="' + TFS + id + '" target="_blank" rel="noopener">#' + id + '</a>'; }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

  function numeros(s) {
    var st = s.stats, total = st.done + st.prog + st.todo + st.block;
    var pct = total ? Math.round(st.done / total * 100) : 0;
    return '<div class="resumo">' +
      '<span>' + plural(st.done, 'finalizada', 'finalizadas') + '</span>' +
      '<span>' + st.prog + ' em andamento</span>' +
      '<span>' + plural(st.todo, 'pendente', 'pendentes') + '</span>' +
      (st.block ? '<span class="alerta">' + plural(st.block, 'bloqueada', 'bloqueadas') + '</span>' : '') +
      '</div><div class="progresso" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
      '<div class="legenda">' + pct + '% dos ' + total + ' itens da semana finalizados</div>';
  }

  // Liga #id do TFS no texto do resumo, sem mexer em link que já existe.
  function linkarIds(html) {
    return html.replace(/(<a\b[^>]*>.*?<\/a>)|#(\d{6,8})\b/g, function (m, a, id) { return a || link(id); });
  }

  function resumo(s) {
    if (!s.resumo_html) return '';
    var box = document.createElement('section');
    box.className = 'card texto';
    box.innerHTML = linkarIds(s.resumo_html);
    // "## Prioridades..." seguido de lista numerada vira cards
    [].forEach.call(box.querySelectorAll('h2'), function (h) {
      var ol = h.nextElementSibling;
      if (/^prioridades/i.test(h.textContent.trim()) && ol && ol.tagName === 'OL') ol.className = 'prios';
    });
    return box.outerHTML;
  }

  function bloqueios(s) {
    if (!s.bloqueios.length) return '';
    return '<section class="bloqueios"><h2>Bloqueado — precisa de decisão</h2><ul>' +
      s.bloqueios.map(function (i) {
        return '<li>' + link(i.id) + ' ' + esc(i.titulo) +
          (i.dias == null ? '' : ' · parado há ' + plural(i.dias, 'dia', 'dias')) + '</li>';
      }).join('') + '</ul></section>';
  }

  function linha(i, frente) {
    var badge = i.bucket === 'block' ? 'bloqueado' : i.bucket === 'prog' ? 'em andamento' : '';
    return '<li>' + link(i.id) + ' <span>' + esc(i.titulo) + '</span>' +
      (badge ? '<span class="badge">' + badge + '</span>' : '') +
      (frente ? '<span class="frente">' + esc(frente) + '</span>' : '') + '</li>';
  }

  function pendencias(s) {
    var html = s.frentes.map(function (f) {
      var abertos = f.itens.filter(function (i) { return i.bucket !== 'done'; });
      if (!abertos.length) return '';
      var quente = abertos.some(function (i) { return i.bucket !== 'todo'; });
      // grupo longo nasce fechado para não empurrar o resto da página para baixo
      var aberto = quente || abertos.length <= 8;
      return '<details' + (aberto ? ' open' : '') + '><summary>' + esc(f.nome) +
        ' <span class="count">' + abertos.length + '</span></summary><ul class="lista">' +
        abertos.map(function (i) { return linha(i); }).join('') + '</ul></details>';
    }).join('');
    return html ? '<h2>Pendências no meu nome</h2>' + html : '';
  }

  function finalizadas(s) {
    var feitos = [];
    s.frentes.forEach(function (f) {
      f.itens.forEach(function (i) { if (i.bucket === 'done') feitos.push(linha(i, f.nome)); });
    });
    if (!feitos.length) return '';
    return '<h2>Finalizadas na semana</h2><details class="fechadas"' + (feitos.length <= 12 ? ' open' : '') +
      '><summary>' + plural(feitos.length, 'item finalizado', 'itens finalizados') +
      '</summary><ul class="lista">' + feitos.join('') + '</ul></details>';
  }

  function render(idx) {
    var s = semanas[idx];
    document.getElementById('titulo').textContent = 'Semana de ' + s.periodo;
    document.title = 'Semana ' + s.periodo + ' — SGD';
    document.getElementById('numeros').innerHTML = numeros(s);
    app.innerHTML = bloqueios(s) + resumo(s) + pendencias(s) + finalizadas(s);
  }

  if (!semanas.length) {
    select.hidden = true;
    app.innerHTML = '<div class="vazio">Nenhuma semana ainda. Exporte a query do TFS para ' +
      '<code>dados/AAAA-MM-DD.csv</code> e rode <code>python build.py</code>.</div>';
    return;
  }
  select.innerHTML = semanas.map(function (s, i) {
    return '<option value="' + i + '">' + esc(s.periodo) + '</option>';
  }).join('');
  select.hidden = semanas.length < 2;
  select.addEventListener('change', function () { render(+select.value); });
  if (dados.generated_at) document.getElementById('gerado').textContent = ' · gerado em ' + dados.generated_at;
  render(0);
})();
</script>
</body>
</html>
