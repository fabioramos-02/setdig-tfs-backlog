<script>window.RELATORIO = /*DATA_START*/{"generated_at": "03/11/2026 08:02", "semanas": [{"arquivo": "2026-10-30", "periodo": "26/10 a 30/10", "stats": {"done": 53, "prog": 3, "todo": 56, "block": 0}, "bloqueios": [], "resumo_html": "<h1>Semana de 26/10 a 30/10</h1>\n<p>A semana foi de preparar a integração dos sistemas dos órgãos ao login único. A PoC do SSO do Controlador ficou pronta, com roteiro passo a passo. Os pedidos do CBMMS e do DETRAN entraram no backlog. Os mais de 40 sistemas que precisam migrar para o SmartPass foram mapeados, cada um com sua task. Também começaram os chamados de suporte pelo GLPI, com uma automação própria.</p>\n<h2>Destaques</h2>\n<ul>\n<li><strong>Login único (SSO)</strong> — A PoC em Next.js mostra os 5 passos do login gov.br pelo Controlador. O roteiro de integração tira as dúvidas de cada passo.</li>\n<li><strong>CBMMS e DETRAN</strong> — Os ofícios do Parte Diária e do Portal de Credenciamento viraram PBIs, com o cadastro dos clients e a reunião com cada órgão.</li>\n<li><strong>Migração para o SmartPass</strong> — 34 sistemas de 12 órgãos tiveram uma task de migração lançada, com a lista do BI SETDIG. O banco do Controlador tem 56 aplicações, então a lista ainda vai crescer.</li>\n<li><strong>Selo Arte (IAGRO) no e-MS</strong> — Na conversa com a Duda e o Caetano, a ideia aprovada foi o formulário chegar como documento na área de protocolo do órgão. O fluxo foi desenhado no Excalidraw e revisado com as raias de cada sistema.</li>\n<li><strong>X-Forms</strong> — Os 14 formulários foram vinculados aos serviços em DEV. O time da SGD entrou nos grupos do X-Forms Designer.</li>\n<li><strong>Suporte (GLPI)</strong> — Criamos a automação que abre chamado e lança a task de acompanhamento. Os primeiros chamados foram o 328949 (impressora da Bianca) e o 329004 (cliente de API do GLPI).</li>\n<li><strong>Reuniões</strong> — Houve 6 reuniões na semana. A do alinhamento do TFS entre a X-VIA e o MS gerou ata.</li>\n</ul>\n<h2>Aguardando terceiros</h2>\n<ul>\n<li><strong>ITSM</strong> — O chamado 329004 foi reaberto em 03/11. O app_token chegou, mas o login na API devolve erro 500 no servidor.</li>\n<li><strong>X-VIA (Maycon)</strong> — Precisa confirmar três pontos da migração para o SmartPass: se os callbacks atuais funcionam, quanto tempo o Controlador e o SmartPass vão funcionar juntos e quem cadastra os clients.</li>\n<li><strong>Sandro</strong> — As credenciais do assinador gov.br de desenvolvimento, homologação e produção seguem em andamento.</li>\n<li><strong>GAT</strong> — O chamado 328949, da impressora da Bianca.</li>\n</ul>\n<h2>Urgente do nosso time</h2>\n<p>Marcar as reuniões com o CBMMS e com o DETRAN e solicitar o cadastro dos clients no Controlador. Os dois órgãos só começam a integração depois disso.</p>\n<h2>Esta semana (03/11 a 07/11)</h2>\n<p>O que ficou aberto da semana passada continua nesta. Além disso, entraram três tarefas anotadas em 02/11.</p>\n<ul>\n<li><strong>Login único</strong> — Reunião e credenciais com o CBMMS e o DETRAN. Levantar os sistemas do Controlador que faltam na lista de migração. Acompanhar a resposta da X-VIA sobre a migração.</li>\n<li><strong>Assinador gov.br</strong> — Fechar as 3 solicitações do assinador e repassar as credenciais à X-VIA.</li>\n<li><strong>Formulário no e-MS</strong> — Formalizar a demanda com o Robson, validar o fluxo com a IAGRO e a FUNDECT e desenhar o fluxo atual e o novo.</li>\n<li><strong>X-Forms e X-Flows</strong> — Testar o fluxo de exemplo e a API de Tramitação, e dar o retorno da homologação ao Leonardo.</li>\n<li><strong>Cartas de serviço</strong> — Validação em homologação, ajustes no CMS e apresentação à CGE.</li>\n<li><strong>X-Agents</strong> — Cadastrar o servidor de LLM da SES e homologar com o Antonio e a Bianca.</li>\n<li><strong>Novas tarefas</strong> — Instalar o ambiente local do treinamento do Orquestrador de Templates, arrumar a VPN do notebook e ajustar o mini curso de IA para ensinar a montar o prompt em cada sessão.</li>\n<li><strong>Suporte</strong> — Acompanhar os chamados 328949, 329004 e 329475. O token do GLPI depende do ITSM.</li>\n</ul>", "frentes": [{"nome": "CMS Cartas", "itens": [{"id": "1363789", "tipo": "Task", "titulo": "Verificar o andamento da migração dos gerentes e coordenadores no CMS da Carta de Serviços", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 6}, {"id": "1365961", "tipo": "Task", "titulo": "Receber da X-VIA o passo a passo de atribuição das roles no SmartPass", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 7}]}, {"nome": "Cartas de Serviços", "itens": [{"id": "1356686", "tipo": "Task", "titulo": "Apresentar à CGE as cartas de serviço em ambiente de homologação", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 7}, {"id": "1367835", "tipo": "Task", "titulo": "Refinar o pacote de entrega TO BE da revisão com linguagem simples por IA", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 8}, {"id": "1360252", "tipo": "Task", "titulo": "Apoiar o Kauã nas dúvidas e na migração das cartas de serviço", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 8}, {"id": "1346159", "tipo": "Task", "titulo": "Formalizar o envio das pendências para a X-VIA", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 8}, {"id": "1365068", "tipo": "Task", "titulo": "Responder o documento de dúvidas do Kauã sobre a carta de serviço", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 8}, {"id": "1365065", "tipo": "Task", "titulo": "Responder o e-mail de 09/10/2026 sobre manter a busca por nome e endereço", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 7}, {"id": "1346156", "tipo": "Task", "titulo": "Trazer os valores do filtro de motivo de devolução da carta de serviço", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 8}]}, {"nome": "Gestão do c e 05/10 a 09/10</h1>\n<p>Semana de destravar acesso. O treinamento do SmartPass saiu do papel e foi até o fim, a UGSI\nrespondeu sobre os ambientes de desenvolvimento e homologação depois de três semanas, e o banco do\nCMS deixou de ser caixa-preta para a SETDIG.</p>\n<h2>Destaques</h2>\n<ul>\n<li><strong>Treinamento do SmartPass</strong> — partes 1 e 2 realizadas em 05 e 08/10, conduzidas pelo Leonardo\n  Siqueira. A X-VIA entregou as gravações, o roteiro de integração e a POC com os três exercícios,\n  tudo anexado no item do treinamento.</li>\n<li><strong>Acesso ao banco do CMS</strong> — chamado 0304266 aberto e atendido na mesma semana. As credenciais de\n  leitura do <code>db_xvia-cms</code> chegaram em 07/10.</li>\n<li><strong>Segurança dos ambientes</strong> — a UGSI fechou a questão aberta desde 17/09: desenvolvimento sai da\n  internet e passa a exigir VPN; homologação continua acessível por fora, mas sob regra de produção,\n  com MFA e dados só de teste.</li>\n<li><strong>Cartas de serviço</strong> — a planilha de pendências da migração foi entregue ao Victor Carnaval, e a\n  previsão de conclusão da migração foi levantada com a X-VIA.</li>\n<li><strong>FormFlow</strong> — os colaboradores da X-VIA entraram no Controlador e no FormFlow de homologação.</li>\n</ul>\n<h2>Aguardando terceiros</h2>\n<ul>\n<li><strong>X-VIA</strong> — definir quem corrige cada pendência da planilha de migração das cartas.</li>\n<li><strong>Equipe da Thereza</strong> — a governança do Design System passou a ser conduzida por ela. Enquanto não\n  sai, o acesso ao registry para órgão fora do grupo xvia segue sem solução, e o Corpo de Bombeiros\n  depende disso.</li>\n<li><strong>UGSI, Infraestrutura e X-VIA</strong> — aplicar o que foi decidido: VPN no ambiente de desenvolvimento\n  e MFA no de homologação. A decisão existe, a configuração não.</li>\n</ul>\n<h2>Urgente do nosso time</h2>\n<p>Marcar a reunião das áreas sobre o acesso a desenvolvimento e homologação. A X-VIA perde o acesso\npor fora assim que a regra for aplicada, e ninguém assumiu prazo para o túnel VPN que eles mesmos\nvão manter — sem isso, o time de desenvolvimento deles fica sem ambiente.</p>\n<p>Falta também testar a conexão ao banco do CMS e confirmar na prática que o usuário é somente\nleitura. O sufixo <code>_ro</code> no nome não é garantia de permissão.</p>", "frentes": [{"nome": "Cartas de Serviços", "itens": [{"id": "1360252", "tipo": "Task", "titulo": "Apoiar o Kauã nas dúvidas e na migração das cartas de serviço", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 29}, {"id": "1359940", "tipo": "Task", "titulo": "Preencher na planilha as pendências das cartas de serviço para a migração", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 29}, {"id": "1360737", "tipo": "Task", "titulo": "Verificar a previsão de conclusão da migração das cartas de serviço", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 28}]}, {"nome": "Design System", "itens": [{"id": "1340717", "tipo": "Task", "titulo": "Definir a governança do Design System", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 29}]}, {"nome": "Devolutivas XVia", "itens": [{"id": "1352973", "tipo": "Task", "titulo": "Levantar dúvidas do Roteiro de Integração do Smartpass Login para pauta do treinamento", "estado": "In Progress", "bucket": "prog", "responsavel": "Fabio Ramos", "dias": 26}]}, {"nome": "Formulários", "itens": [{"id": "1360251", "tipo": "Task", "titulo": "Levantar na reunião as APIs do FormFlow e a entrega de dados por banco", "estado": "To Do", "bucket": "todo", "responsavel": "Fabio Ramos", "dias": 29}, {"id": "1360659", "tipo": "Task", "titulo": "Incluir os colaboradores da X-VIA no Controlador e no FormFlow de homologação", "estado": "Done", "bucket": "done", "responsavel": "Fabio Ramos", "dias": 28}, {"id": "1360250", "tipo": "Task", "titulo": "Pedir ao Hugo e à Cris o contato com o Caetano para mar <script>
(function () {
  var TFS = 'https://tfs.sgi.ms.gov.br/tfs/Global/XVIA/_workitems/edit/';
  var BUCKETS = [
    { key: 'done',  label: 'Finalizado' },
    { key: 'prog',  label: 'Em andamento' },
    { key: 'todo',  label: 'Pendente' },
    { key: 'block', label: 'Bloqueado' }
  ];
  var app = document.getElementById('app');
  var select = document.getElementById('week-select');
  var meta = document.getElementById('meta');
  var dados = window.RELATORIO || { semanas: [] };
  var semanas = dados.semanas || [];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderStats(s) {
    var total = BUCKETS.reduce(function (n, b) { return n + (s.stats[b.key] || 0); }, 0) || 1;
    return '<section class="stats">' + BUCKETS.map(function (b) {
      var v = s.stats[b.key] || 0;
      var pct = Math.round(v / total * 100);
      return '<div class="stat stat--' + b.key + '">' +
        '<div class="stat-value">' + v + '</div>' +
        '<div class="stat-label">' + b.label + '</div>' +
        '<div class="stat-bar"><span style="width:' + pct + '%"></span></div>' +
        '</div>';
    }).join('') + '</section>';
  }

  function renderBloqueios(s) {
    if (!s.bloqueios || !s.bloqueios.length) return '';
    return '<section class="blocks"><h2>Bloqueado — precisa de decisão</h2><ul>' +
      s.bloqueios.map(function (i) {
        var dias = i.dias == null ? '' :
          ' <span class="days">· parado há ' + i.dias + (i.dias === 1 ? ' dia' : ' dias') + '</span>';
        return '<li><a href="' + TFS + i.id + '" target="_blank" rel="noopener">#' + i.id + '</a> · ' +
          esc(i.titulo) + dias + '</li>';
      }).join('') + '</ul></section>';
  }

  function renderResumo(s) {
    if (!s.resumo_html) return '';
    return '<section class="card resumo">' + s.resumo_html + '</section>';
  }

  function linha(i) {
    return '<li class="item">' +
      '<span class="status-tag status-tag--' + i.bucket + '">' + esc(i.bucket === 'block' ? 'Bloqueado' : i.estado) + '</span>' +
      '<span class="item-id"><a href="' + TFS + i.id + '" target="_blank" rel="noopener">#' + i.id + '</a></span>' +
      '<span class="item-titulo">' + esc(i.titulo) + '</span>' +
      '<span class="item-resp">' + esc(i.responsavel) + '</span>' +
      '</li>';
  }

  function renderFrentes(s) {
    if (!s.frentes || !s.frentes.length) return '';
    return '<h2 class="secao">Entregas por frente</h2>' + s.frentes.map(function (f) {
      var abertos = f.itens.filter(function (i) { return i.bucket !== 'done'; });
      var fechados = f.itens.filter(function (i) { return i.bucket === 'done'; });
      var corpo = '';

      if (abertos.length) corpo += '<ul class="itens">' + abertos.map(linha).join('') + '</ul>';

      // Lista longa de finalizado e scroll sem informacao. Acima de 5, recolhe.
      if (fechados.length > 5) {
        corpo += '<details class="fechados"><summary>' + fechados.length +
          ' finalizados</summary><ul class="itens">' + fechados.map(linha).join('') +
          '</ul></details>';
      } else if (fechados.length) {
        corpo += '<ul class="itens">' + fechados.map(linha).join('') + '</ul>';
      }

      return '<details class="frente"' + (abertos.length ? ' open' : '') + '>' +
        '<summary><span class="frente-nome">' + esc(f.nome) + '</span>' +
        (abertos.length ? '<span class="frente-abertos">' + abertos.length + ' em aberto</span>' : '') +
        '<span class="frente-count">' + f.itens.length + '</span></summary>' +
        corpo + '</details>';
    }).join('');
  }

  function render(idx) {
    var s = semanas[idx];
    if (!s) {
      app.innerHTML = '<div class="empty">Nenhuma semana ainda.<br>' +
        'Exporte a query do TFS para <code>dados/AAAA-MM-DD.csv</code> e rode <code>python build.py</code>.</div>';
      return;
    }
    app.innerHTML = renderStats(s) + renderBloqueios(s) + renderResumo(s) + renderFrentes(s);
  }

  if (!semanas.length) {
    select.style.display = 'none';
    render(-1);
    return;
  }

  select.innerHTML = semanas.map(function (s, i) {
    return '<option value="' + i + '">' + esc(s.periodo) + '</option>';
  }).join('');
  select.addEventListener('change', function () { render(Number(select.value)); });

  meta.textContent = semanas.length + ' semana' + (semanas.length === 1 ? '' : 's') +
    (dados.generated_at ? ' · ' + dados.generated_at : '');
  render(0);
})();
</script>
